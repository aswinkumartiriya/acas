<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACAS - Aswin Cloud Apps Store</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:system-ui,-apple-system,sans-serif;background:#f8f9fa;color:#333;}
  header{background:#fff;padding:20px 40px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 4px rgba(0,0,0,.05);}
  .logo{display:flex;flex-direction:column;align-items:center;}
  .logo img{height:70px;}
  .logo span{margin-top:6px;font-size:22px;font-weight:500;color:#5a6a7a;letter-spacing:2px;}
  .search{background:#f1f3f5;border:none;border-radius:24px;padding:12px 20px;width:320px;font-size:15px;outline:none;}
  .container{max-width:1200px;margin:40px auto;padding:0 20px;}
  h2{margin-bottom:24px;color:#2c3e50;}
  .apps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px;}
  .app-card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.06);transition:.2s;}
  .app-card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.1);}
  .app-icon{width:48px;height:48px;background:#e8f4fd;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:16px;}
  .app-card h3{margin-bottom:8px;}
  .app-card p{color:#666;font-size:14px;margin-bottom:16px;}
  .open-btn{background:#e8f4fd;color:#4a90e2;border:none;border-radius:20px;padding:8px 20px;cursor:pointer;font-weight:600;}
  .open-btn:hover{background:#d0e7fb;}
  footer{text-align:center;padding:40px;color:#888;}
  .modal{display:none;position:fixed;z-index:1000;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;}
  .modal-content{background:#fff;padding:24px;border-radius:20px;max-width:95%;max-height:90vh;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,0.2);}
  .close-btn{float:right;font-size:24px;cursor:pointer;color:#888;}
  .news-item{background:#f8f9fa;border-radius:12px;padding:16px;margin-bottom:12px;}
  .news-item .meta{font-size:12px;color:#888;margin:4px 0 8px;}
  .news-item a{color:#4a90e2;}
  input,select,button.ctrl{padding:10px;margin:5px;border-radius:8px;border:1px solid #ddd;}
  canvas{border:1px solid #ddd;border-radius:8px;touch-action:none;}

  /* --- KIDS GOOGLE CALCULATOR STYLES --- */
  .kid-calc-card {
    background: #ffffff;
    width: 100%;
    max-width: 540px;
    border-radius: 24px;
    box-shadow: 0 12px 36px rgba(100, 149, 237, 0.15);
    padding: 20px;
    margin: 0 auto;
    font-family: 'Quicksand', sans-serif;
  }
  .kid-calc-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .kid-calc-title {
    font-family: 'Fredoka One', cursive;
    color: #4A90E2;
    font-size: 1.3rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sound-btn {
    background: #e8f4fd;
    border: none;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    cursor: pointer;
    font-size: 1.1rem;
  }
  .display-box {
    background: #F4F8fc;
    border: 2px solid #E1EDF7;
    border-radius: 16px;
    padding: 14px 18px;
    margin-bottom: 16px;
    position: relative;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
  }
  .history-trigger {
    position: absolute;
    top: 10px;
    left: 12px;
    background: none;
    border: none;
    font-size: 1.1rem;
    cursor: pointer;
    color: #7A8B9E;
  }
  .deg-rad-indicator {
    position: absolute;
    bottom: 8px;
    left: 14px;
    font-size: 0.75rem;
    font-weight: 700;
    color: #4A90E2;
    background: #E2EEF9;
    padding: 2px 8px;
    border-radius: 8px;
  }
  .expression-line {
    font-size: 0.9rem;
    color: #8899A6;
    min-height: 20px;
    text-align: right;
    word-wrap: break-word;
  }
  .main-display {
    font-family: 'Fredoka One', cursive;
    font-size: 2.2rem;
    color: #2C3E50;
    text-align: right;
    overflow-x: auto;
    white-space: nowrap;
    min-height: 48px;
  }
  .calc-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 7px;
  }
  .calc-btn {
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    border: none;
    border-radius: 12px;
    padding: 12px 2px;
    cursor: pointer;
    user-select: none;
    transition: all 0.1s ease;
    box-shadow: 0 3px 0 rgba(0,0,0,0.08);
  }
  .calc-btn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.08);
  }
  .btn-num { background: #E8F1F9; color: #2C3E50; }
  .btn-op { background: #E2F4EC; color: #1E825A; }
  .btn-sci { background: #EDE8F5; color: #5B4B8A; }
  .btn-clear { background: #FDE8E8; color: #E53935; }
  .btn-eq { background: #3B82F6; color: white; box-shadow: 0 3px 0 #1D4ED8; }
  .btn-mode { background: #FEF3C7; color: #D97706; }
  
  .history-panel {
    display: none;
    background: #fff;
    border: 2px solid #E1EDF7;
    border-radius: 16px;
    padding: 12px;
    margin-bottom: 12px;
    max-height: 140px;
    overflow-y: auto;
    font-size: 0.85rem;
  }
  .history-item {
    display: flex;
    justify-content: space-between;
    padding: 6px 4px;
    border-bottom: 1px dashed #eee;
    cursor: pointer;
  }
  @media (max-width: 500px) {
    .calc-btn { font-size: 0.8rem; padding: 10px 1px; border-radius: 8px; }
    .main-display { font-size: 1.7rem; }
  }
</style>
</head>
