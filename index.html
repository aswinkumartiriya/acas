<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACAS Kid Scientific Calculator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for Kid-Friendly Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 50%, #fef3c7 100%);
        }
        .kid-font {
            font-family: 'Fredoka', cursive;
        }
        
        /* Playful Button Press & Glow Effects */
        .btn-press {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-press:active {
            transform: scale(0.92) translateY(2px);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.15) !important;
        }
        
        /* Custom Scrollbar for Display & History */
        .custom-scroll::-webkit-scrollbar {
            height: 4px;
            width: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        /* Glassmorphism card effect */
        .calc-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08), 
                        0 0 0 1px rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-3 sm:p-6 text-slate-700">

    <!-- ACAS Header Branding -->
    <header class="mb-4 text-center">
        <div class="inline-flex items-center gap-2 bg-white/80 backdrop-blur px-4 py-1.5 rounded-full shadow-sm border border-white">
            <span class="kid-font text-sky-500 font-bold text-lg tracking-wider">∧ C Λ S</span>
            <span class="text-xs bg-sky-100 text-sky-700 font-semibold px-2 py-0.5 rounded-full">Kids Calc</span>
        </div>
    </header>

    <!-- Calculator Main Container -->
    <main class="calc-card w-full max-w-2xl rounded-3xl p-4 sm:p-6 border border-white/60">
        
        <!-- Display Container Inspired by Google Calculator -->
        <div class="relative bg-gradient-to-b from-slate-50 to-white rounded-2xl p-4 mb-4 border border-slate-200/80 shadow-inner flex flex-col justify-between min-h-[110px]">
            <!-- Top Controls (History Icon + Mode Indicator) -->
            <div class="flex items-center justify-between text-xs text-slate-400 font-medium">
                <button id="history-btn" onclick="toggleHistory()" class="p-1.5 hover:bg-slate-100 rounded-lg transition-colors flex items-center gap-1 text-slate-500" title="Calculation History">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span>History</span>
                </button>
                <div class="flex items-center gap-2">
                    <span id="angle-mode-badge" class="bg-blue-100 text-blue-600 px-2 py-0.5 rounded-md font-bold text-[10px]">DEG</span>
                    <span id="memory-badge" class="hidden bg-amber-100 text-amber-600 px-2 py-0.5 rounded-md font-bold text-[10px]">ANS</span>
                </div>
            </div>

            <!-- Expression Screen -->
            <div id="expression" class="text-right text-slate-400 text-sm sm:text-base overflow-x-auto whitespace-nowrap custom-scroll h-6">
                <!-- Expression populated dynamically -->
            </div>

            <!-- Main Result Output Screen -->
            <div id="display" class="text-right text-3xl sm:text-4xl font-bold text-slate-800 overflow-x-auto whitespace-nowrap custom-scroll kid-font tracking-wide">
                0
            </div>
        </div>

        <!-- History Overlay Panel -->
        <div id="history-panel" class="hidden bg-slate-50 rounded-xl p-3 mb-4 max-h-40 overflow-y-auto border border-slate-200 custom-scroll text-xs">
            <div class="flex justify-between items-center mb-2 pb-1 border-b text-slate-400 font-semibold">
                <span>Recent Calculations</span>
                <button onclick="clearHistory()" class="text-red-400 hover:text-red-600">Clear</button>
            </div>
            <div id="history-list" class="space-y-1 text-right text-slate-600">
                <div class="text-center text-slate-400 py-2">No history yet ✨</div>
            </div>
        </div>

        <!-- Grid Layout: Google Calc Inspired Buttons -->
        <div class="grid grid-cols-7 gap-1.5 sm:gap-2 text-xs sm:text-sm font-semibold">

            <!-- ROW 1 -->
            <button onclick="toggleAngleMode()" id="angle-toggle" class="btn-press py-3 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-600 border border-indigo-100 shadow-sm kid-font">Deg</button>
            <button onclick="appendFunc('fact')" class="btn-press py-3 rounded-xl bg-purple-50 hover:bg-purple-100 text-purple-600 border border-purple-100 shadow-sm">x!</button>
            <button onclick="appendInput('(')" class="btn-press py-3 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-600 border border-indigo-100 shadow-sm">(</button>
            <button onclick="appendInput(')')" class="btn-press py-3 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-600 border border-indigo-100 shadow-sm">)</button>
            <button onclick="appendInput('%')" class="btn-press py-3 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-100 shadow-sm">%</button>
            <button onclick="clearDisplay()" class="btn-press py-3 rounded-xl bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold border border-rose-200 shadow-sm col-span-2 sm:col-span-1">AC</button>
            <button onclick="deleteLast()" class="btn-press hidden sm:block py-3 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-100 shadow-sm">⌫</button>

            <!-- ROW 2 -->
            <button onclick="appendFunc('inv')" class="btn-press py-3 rounded-xl bg-purple-50 hover:bg-purple-100 text-purple-600 border border-purple-100 shadow-sm">Inv</button>
            <button onclick="appendFunc('sin')" class="btn-press py-3 rounded-xl bg-purple-50 hover:bg-purple-100 text-purple-600 border border-purple-100 shadow-sm">sin</button>
            <button onclick="appendFunc('ln')" class="btn-press py-3 rounded-xl bg-purple-50 hover:bg-purple-100 text-purple-600 border border-purple-100 shadow-sm">ln</button>
            <button onclick="appendInput('7')" class="btn-press py-3 rounded-xl bg-sky-50 hover:bg-sky-100 text-slate-700 text-base font-bold border border-sky-100 shadow-sm">7</button>
            <button onclick="appendInput('8')" class="btn-press py-3 rounded-xl bg-sky-50 hover:bg-sky-100 text-slate-700 text-base font-bold border border-sky-100 shadow-sm">8</button>
            <button onclick="appendInput('9')" class="btn-press py-3 rounded-xl bg-sky-50 hover:bg-sky-100 text-slate-700 text-base font-bold border border-sky-100 shadow-sm">9</button>
            <button onclick="appendInput('/')" class="btn-press py-3 rounded-xl bg-emerald-100 hover:bg-emerald-200 text-emerald-800 text-base font-bold border border-emerald-200 shadow-sm">÷</button>

            <!-- ROW 3 -->
            <button onclick="appendConstant('π')" class="btn-press py-3 rounded-xl bg-purple-50 hover:bg-purple-100 text-purple-600 border border-purple-100 shadow-sm">π</button>
            <button onclick="appendFunc('cos')" class="btn-press py-3 rounded-xl bg-purple-50 hover:bg-purple-100 text-purple-600 border border-purple-100 shadow-sm">cos</button>
            <button onclick="appendFunc('log')" class="btn-press py-3 rounded-xl bg-purple-50 hover:bg-purple-100 text-purple-600 border border-purple-100 shadow-sm">log</button>
            <button onclick="appendInput('4')" class="btn-press py-3 rounded-xl bg-sky-50 hover:bg-sky-100 text-slate-700 text-base font-bold border border-sky-100 shadow-sm">4</button>
            <button onclick="appendInput('5')" class="btn-press py-3 rounded-xl bg-sky-50 hover:bg-sky-100 text-slate-700 text-base font-bold border border-sky-100 shadow-sm">5</button>
            <button onclick="appendInput('6')" class="btn-press py-3 rounded-xl bg-sky-50 hover:bg-sky-100 text-slate-700 text-base font-bold border border-sky-100 shadow-sm">6</button>
            <button onclick="appendInput('*')" class="btn-press py-3 rounded-xl bg-emerald-100 hover:bg-emerald-200 text-emerald-800 text-base font-bold border border-emerald-200 shadow-sm">×</button>

            <!-- ROW 4 -->
            <button onclick="appendConstant('e')" class="btn-press py-3 rounded-xl bg-purple-50 hover:bg-purple-100 text-purple-600 border border-purple-100 shadow-sm">e</button>
            <button onclick="appendFunc('tan')" class="btn-press py-3 rounded-xl bg-purple-50 hover:bg-purple-100 text-purple-600 border border-purple-100 shadow-sm">tan</button>
            <button onclick="appendFunc('sqrt')" class="btn-press py-3 rounded-xl bg-purple-50 hover:bg-purple-100 text-purple-600 border border-purple-100 shadow-sm">√</button>
            <button onclick="appendInput('1')" class="btn-press py-3 rounded-xl bg-sky-50 hover:bg-sky-100 text-slate-700 text-base font-bold border border-sky-100 shadow-sm">1</button>
            <button onclick="appendInput('2')" class="btn-press py-3 rounded-xl bg-sky-50 hover:bg-sky-100 text-slate-700 text-base font-bold border border-sky-100 shadow-sm">2</button>
            <button onclick="appendInput('3')" class="btn-press py-3 rounded-xl bg-sky-50 hover:bg-sky-100 text-slate-700 text-base font-bold border border-sky-100 shadow-sm">3</button>
            <button onclick="appendInput('-')" class="btn-press py-3 rounded-xl bg-emerald-100 hover:bg-emerald-200 text-emerald-800 text-base font-bold border border-emerald-200 shadow-sm">−</button>

            <!-- ROW 5 -->
            <button onclick="appendAns()" class="btn-press py-3 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-100 shadow-sm">Ans</button>
            <button onclick="appendInput('EXP')" class="btn-press py-3 rounded-xl bg-purple-50 hover:bg-purple-100 text-purple-600 border border-purple-100 shadow-sm">EXP</button>
            <button onclick="appendInput('^')" class="btn-press py-3 rounded-xl bg-purple-50 hover:bg-purple-100 text-purple-600 border border-purple-100 shadow-sm">x<sup>y</sup></button>
            <button onclick="appendInput('0')" class="btn-press py-3 rounded-xl bg-sky-50 hover:bg-sky-100 text-slate-700 text-base font-bold border border-sky-100 shadow-sm">0</button>
            <button onclick="appendInput('.')" class="btn-press py-3 rounded-xl bg-sky-50 hover:bg-sky-100 text-slate-700 text-base font-bold border border-sky-100 shadow-sm">.</button>
            <button onclick="calculateResult()" class="btn-press py-3 rounded-xl bg-blue-500 hover:bg-blue-600 text-white text-lg font-bold border border-blue-400 shadow-md transition-all shadow-blue-200">=</button>
            <button onclick="appendInput('+')" class="btn-press py-3 rounded-xl bg-emerald-100 hover:bg-emerald-200 text-emerald-800 text-base font-bold border border-emerald-200 shadow-sm">+</button>

        </div>
    </main>

    <!-- Footer note -->
    <footer class="mt-4 text-xs text-slate-400 text-center">
        Designed for <strong class="text-slate-600">∧ C Λ S</strong> • Clean, Lightweight & Private
    </footer>

    <!-- Calculator Logic Script -->
    <script>
        let currentInput = "0";
        let expression = "";
        let isDegree = true;
        let isInverse = false;
        let lastAnswer = 0;
        let history = [];

        const displayEl = document.getElementById('display');
        const expressionEl = document.getElementById('expression');
        const angleToggleBtn = document.getElementById('angle-toggle');
        const angleBadge = document.getElementById('angle-mode-badge');
        const memoryBadge = document.getElementById('memory-badge');

        function updateDisplay() {
            displayEl.innerText = currentInput || "0";
            expressionEl.innerText = expression;
        }

        function appendInput(val) {
            if (currentInput === "0" && !isNaN(val)) {
                currentInput = val;
            } else if (currentInput === "0" && val === ".") {
                currentInput = "0.";
            } else {
                currentInput += val;
            }
            updateDisplay();
        }

        function appendConstant(symbol) {
            if (currentInput === "0") {
                currentInput = symbol;
            } else {
                currentInput += symbol;
            }
            updateDisplay();
        }

        function appendFunc(funcName) {
            if (funcName === 'inv') {
                isInverse = !isInverse;
                return;
            }
            
            if (currentInput === "0") {
                currentInput = funcName + "(";
            } else {
                currentInput += funcName + "(";
            }
            updateDisplay();
        }

        function clearDisplay() {
            currentInput = "0";
            expression = "";
            updateDisplay();
        }

        function deleteLast() {
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = "0";
            }
            updateDisplay();
        }

        function toggleAngleMode() {
            isDegree = !isDegree;
            angleToggleBtn.innerText = isDegree ? "Deg" : "Rad";
            angleBadge.innerText = isDegree ? "DEG" : "RAD";
        }

        function appendAns() {
            if (currentInput === "0") {
                currentInput = lastAnswer.toString();
            } else {
                currentInput += lastAnswer.toString();
            }
            updateDisplay();
        }

        function calculateResult() {
            try {
                let parsed = currentInput;
                const originalExpr = currentInput;

                parsed = parsed.replace(/π/g, Math.PI);
                parsed = parsed.replace(/e/g, Math.E);
                parsed = parsed.replace(/×/g, '*').replace(/÷/g, '/');

                parsed = parsed.replace(/(\d+)\!/g, (match, n) => factorial(parseInt(n)));

                const toRad = (val) => isDegree ? (val * Math.PI / 180) : val;

                parsed = parsed.replace(/sin\(([^)]+)\)/g, (m, arg) => Math.sin(toRad(eval(arg))));
                parsed = parsed.replace(/cos\(([^)]+)\)/g, (m, arg) => Math.cos(toRad(eval(arg))));
                parsed = parsed.replace(/tan\(([^)]+)\)/g, (m, arg) => Math.tan(toRad(eval(arg))));
                
                parsed = parsed.replace(/log\(([^)]+)\)/g, (m, arg) => Math.log10(eval(arg)));
                parsed = parsed.replace(/ln\(([^)]+)\)/g, (m, arg) => Math.log(eval(arg)));
                parsed = parsed.replace(/sqrt\(([^)]+)\)/g, (m, arg) => Math.sqrt(eval(arg)));
                
                parsed = parsed.replace(/\^/g, '**');

                let result = eval(parsed);

                if (typeof result === 'number') {
                    result = Math.round(result * 1e10) / 1e10;
                }

                expression = originalExpr + " =";
                lastAnswer = result;
                currentInput = result.toString();

                addToHistory(originalExpr, result);
                memoryBadge.classList.remove('hidden');

            } catch (err) {
                currentInput = "Error";
            }
            updateDisplay();
        }

        function factorial(n) {
            if (n < 0) return NaN;
            if (n === 0 || n === 1) return 1;
            let res = 1;
            for (let i = 2; i <= n; i++) res *= i;
            return res;
        }

        function toggleHistory() {
            const panel = document.getElementById('history-panel');
            panel.classList.toggle('hidden');
        }

        function addToHistory(expr, res) {
            history.unshift({ expr, res });
            if (history.length > 10) history.pop();
            renderHistory();
        }

        function renderHistory() {
            const listEl = document.getElementById('history-list');
            if (history.length === 0) {
                listEl.innerHTML = `<div class="text-center text-slate-400 py-2">No history yet ✨</div>`;
                return;
            }
            listEl.innerHTML = history.map(item => `
                <div class="py-1 border-b border-slate-100 flex justify-between cursor-pointer hover:bg-slate-100 p-1 rounded" onclick="useHistory('${item.res}')">
                    <span class="text-slate-400 font-mono">${item.expr}</span>
                    <span class="font-bold text-sky-600 font-mono">= ${item.res}</span>
                </div>
            `).join('');
        }

        function useHistory(val) {
            currentInput = val;
            updateDisplay();
            toggleHistory();
        }

        function clearHistory() {
            history = [];
            renderHistory();
        }

        document.addEventListener('keydown', (e) => {
            if ((e.key >= '0' && e.key <= '9') || e.key === '.') appendInput(e.key);
            if (['+', '-', '*', '/'].includes(e.key)) appendInput(e.key);
            if (e.key === 'Enter') calculateResult();
            if (e.key === 'Backspace') deleteLast();
            if (e.key === 'Escape') clearDisplay();
        });
    </script>
</body>
</html>
