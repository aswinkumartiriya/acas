<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACAS - Aswin Cloud Apps Store</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:system-ui,-apple-system,sans-serif;background:#f8f9fa;color:#333;}
  header{background:#fff;padding:20px 40px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 4px rgba(0,0,0,.05);}
  .logo{display:flex;flex-direction:column;align-items:center;}
  .logo img{height:70px;}
  .logo span{margin-top:6px;font-size:22px;font-weight:500;color:#5a6a7a;letter-spacing:2px;}
  .search{background:#f1f3f5;border:none;border-radius:24px;padding:12px 20px;width:320px;font-size:15px;outline:none;}
  .container{max-width:1200px;margin:40px auto;padding:0 20px;}
  h2{margin-bottom:24px;color:#2c3e50;}
  .apps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px;}
  .app-card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.06);transition:.2s;}
  .app-card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.1);}
  .app-icon{width:48px;height:48px;background:#e8f4fd;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:16px;}
  .app-card h3{margin-bottom:8px;}
  .app-card p{color:#666;font-size:14px;margin-bottom:16px;}
  .open-btn{background:#e8f4fd;color:#4a90e2;border:none;border-radius:20px;padding:8px 20px;cursor:pointer;}
  footer{text-align:center;padding:40px;color:#888;}
  .modal{display:none;position:fixed;z-index:1000;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;}
  .modal-content{background:#fff;padding:20px;border-radius:16px;max-width:95%;max-height:90vh;overflow:auto;}
  .close-btn{float:right;font-size:24px;cursor:pointer;color:#888;}
  .news-item{background:#f8f9fa;border-radius:12px;padding:16px;margin-bottom:12px;}
  .news-item .meta{font-size:12px;color:#888;margin:4px 0 8px;}
  .news-item a{color:#4a90e2;}
  input,select,button.ctrl{padding:10px;margin:5px;border-radius:8px;border:1px solid #ddd;}
  canvas{border:1px solid #ddd;border-radius:8px;touch-action:none;}
</style>
</head>

  {icon:"✅",name:"To-Do List",desc:"Tasks list",id:"todo"},
  {icon:"🌤️",name:"Weather",desc:"Simple weather",id:"weather"},

const grid = document.getElementById("appsGrid");
apps.forEach(a => {
  grid.innerHTML += `<div class="app-card"><div class="app-icon">${a.icon}</div><h3>${a.name}</h3><p>${a.desc}</p><button class="open-btn" onclick="openApp('${a.id}')">Open</button></div>`;
});

function openApp(id) {
  document.getElementById("modals").innerHTML = "";
  if(id==="calc") openCalc();
  else if(id==="clock") openClock();
  else if(id==="timer") openTimer();
  else if(id==="stop") openStop();
  else if(id==="notes") openNotes();
  else if(id==="todo") openTodo();
  else if(id==="health") openHealth();
  else if(id==="age") openAge();
  else if(id==="flash") openFlash();
  else if(id==="draw") openDraw();
  else if(id==="news") openNews();
  else if(id==="curr") openCurr();
  else if(id==="unit") openUnit();
  else if(id==="cal") openCal();
  else alert("This app is coming soon!");
}

function showModal(html) {
  document.getElementById("modals").innerHTML = `<div class="modal" style="display:flex" onclick="if(event.target===this)this.remove()"><div class="modal-content">${html}<br><button onclick="this.closest('.modal').remove()">Close</button></div></div>`;
}

function openCalc() {
  showModal(`<h3>Calculator</h3><div id="disp" style="font-size:28px;text-align:right;padding:10px;background:#f1f3f5;border-radius:8px;margin:10px 0">0</div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
  <button onclick="c('C')">C</button><button onclick="c('/')">/</button><button onclick="c('*')">×</button><button onclick="c('⌫')">⌫</button>
  <button onclick="c('7')">7</button><button onclick="c('8')">8</button><button onclick="c('9')">9</button><button onclick="c('-')">-</button>
  <button onclick="c('4')">4</button><button onclick="c('5')">5</button><button onclick="c('6')">6</button><button onclick="c('+')">+</button>
  <button onclick="c('1')">1</button><button onclick="c('2')">2</button><button onclick="c('3')">3</button><button onclick="c('=')" style="grid-column:span 2;background:#28a745;color:#fff">=</button>
  <button onclick="c('0')">0</button><button onclick="c('.')">.</button></div>`);
  window.c = function(v){
    let d=document.getElementById("disp");
    if(v==="C") d.innerText="0";
    else if(v==="⌫") d.innerText=d.innerText.slice(0,-1)||"0";
    else if(v==="="){ try{d.innerText=eval(d.innerText.replace("×","*"))}catch(e){d.innerText="Error"} }
    else { if(d.innerText==="0" && v!==".") d.innerText=v; else d.innerText+=v; }
  };
}

function openClock() {
  showModal(`<h3>Clock</h3><div id="clk" style="font-size:48px;text-align:center;margin:20px">--:--:--</div>`);
  setInterval(()=>{ const n=new Date(); document.getElementById("clk").innerText=n.toLocaleTimeString(); },1000);
}

function openTimer() {
  showModal(`<h3>Timer</h3><input id="tm" type="number" placeholder="Seconds" value="60"><button onclick="startT()">Start</button><div id="tdisp" style="font-size:36px;margin:10px">0</div>`);
  window.startT=function(){ let s=+document.getElementById("tm").value; const i=setInterval(()=>{ document.getElementById("tdisp").innerText=s; if(s--<=0){clearInterval(i); alert("Time up!");} },1000); };
}

function openStop() {
  showModal(`<h3>Stopwatch</h3><div id="sw" style="font-size:36px">0.0</div><button onclick="ss()">Start/Stop</button><button onclick="sr()">Reset</button>`);
  let t=0,iv,run=false;
  window.ss=()=>{ if(run){clearInterval(iv);run=false;} else {run=true; iv=setInterval(()=>{t+=0.1; document.getElementById("sw").innerText=t.toFixed(1);},100);} };
  window.sr=()=>{ t=0; document.getElementById("sw").innerText="0.0"; };
}

function openNotes() {
  showModal(`<h3>Notes</h3><textarea id="nt" style="width:100%;height:200px">${localStorage.acasNotes||""}</textarea><br><button onclick="localStorage.acasNotes=document.getElementById('nt').value;alert('Saved')">Save</button>`);
}

function openTodo() {
  showModal(`<h3>To-Do</h3><input id="ti"><button onclick="addT()">Add</button><ul id="tl"></ul>`);
  let list = JSON.parse(localStorage.acasTodo||"[]");
  function render(){ document.getElementById("tl").innerHTML=list.map((t,i)=>`<li>${t} <button onclick="list.splice(${i},1);localStorage.acasTodo=JSON.stringify(list);render()">x</button></li>`).join(""); }
  window.addT=()=>{ list.push(document.getElementById("ti").value); localStorage.acasTodo=JSON.stringify(list); render(); document.getElementById("ti").value=""; };
  render();
}

function openHealth() {
  showModal(`<h3>Health Check (BMI)</h3>Height (cm): <input id="h" type="number"><br>Weight (kg): <input id="w" type="number"><br><button onclick="calcB()">Calculate</button><div id="br"></div>`);
  window.calcB=()=>{ let h=+document.getElementById("h").value/100, w=+document.getElementById("w").value; let b=(w/(h*h)).toFixed(1); document.getElementById("br").innerText="BMI: "+b; };
}

function openAge() {
  showModal(`<h3>Age Calculator</h3>Birth Date: <input id="bd" type="date"><button onclick="ca()">Calculate</button><div id="ar"></div>`);
  window.ca=()=>{ let b=new Date(document.getElementById("bd").value), n=new Date(); let a=n.getFullYear()-b.getFullYear(); document.getElementById("ar").innerText="Age: "+a+" years"; };
}

function openFlash() {
  showModal(`<h3>Flashlight</h3><div id="fl" style="width:200px;height:200px;background:#000;margin:20px auto;border-radius:20px"></div><button onclick="document.getElementById('fl').style.background=document.getElementById('fl').style.background==='rgb(255, 255, 255)'?'#000':'#fff'">Toggle</button>`);
}

function openDraw() {
  showModal(`<h3>Simple Drawing</h3><canvas id="cv" width="400" height="300"></canvas><br>Color:<input type="color" id="col" value="#000"><button onclick="document.getElementById('cv').getContext('2d').clearRect(0,0,400,300)">Clear</button>`);
  setTimeout(()=>{
    const c=document.getElementById("cv"), ctx=c.getContext("2d"); let d=false;
    c.onmousedown=e=>{d=true; ctx.beginPath(); ctx.moveTo(e.offsetX,e.offsetY);};
    c.onmousemove=e=>{ if(d){ctx.strokeStyle=document.getElementById("col").value; ctx.lineTo(e.offsetX,e.offsetY); ctx.stroke();} };
    c.onmouseup=()=>d=false;
  },100);
}

function openCurr() {
  showModal(`<h3>Currency Converter</h3>Amount: <input id="am" type="number" value="1"><br>From: <select id="fr"><option>INR</option><option>USD</option><option>EUR</option></select> To: <select id="to"><option>USD</option><option>INR</option><option>EUR</option></select><br><button onclick="cc()">Convert</button><div id="cr"></div>`);
  window.cc=()=>{ let a=+document.getElementById("am").value; document.getElementById("cr").innerText="Approx: "+(a*83).toFixed(2)+" (demo rate)"; };
}

function openUnit() {
  showModal(`<h3>Unit Converter</h3>Value: <input id="uv" type="number"><br><select id="ut"><option value="km">km to miles</option><option value="kg">kg to pounds</option></select><button onclick="uc()">Convert</button><div id="ur"></div>`);
  window.uc=()=>{ let v=+document.getElementById("uv").value, t=document.getElementById("ut").value; document.getElementById("ur").innerText = t==="km" ? (v*0.621).toFixed(2)+" miles" : (v*2.2).toFixed(2)+" pounds"; };
}

function openCal() {
  const d=new Date();
  showModal(`<h3>Calendar</h3><div style="font-size:20px;text-align:center">${d.toDateString()}</div><p>Simple view. Full calendar coming later.</p>`);
}
